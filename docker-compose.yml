services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blank-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - postgres
    networks:
      - blank-net

  nginx:
    image: nginx:alpine
    container_name: blank-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - blank-net

  postgres:
    image: postgres:16
    container_name: blank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blank
      POSTGRES_USER: blank
      POSTGRES_PASSWORD: blank
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - blank-net

networks:
  blank-net:
    driver: bridge

volumes:
  pg_data:
