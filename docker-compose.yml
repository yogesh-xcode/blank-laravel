services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blank-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blank-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x php-fpm || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  nginx:
    image: nginx:alpine
    container_name: blank-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - blank-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  postgres:
    image: postgres:16
    container_name: blank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blank}
      POSTGRES_USER: ${DB_USERNAME:-blank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - blank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

networks:
  blank-net:
    driver: bridge

volumes:
  pg_data:
