services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blank-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks:
      - blank-net

  nginx:
    image: nginx:alpine
    container_name: blank-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - blank-net

  mysql:
    image: mysql:8.0
    container_name: blank-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blank
      MYSQL_USER: blank
      MYSQL_PASSWORD: blank
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blank-net

networks:
  blank-net:
    driver: bridge

volumes:
  mysql_data:
